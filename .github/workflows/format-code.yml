---
name: "Format Code: ensure code formatting guidelines are met"
"on":
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: read-all

jobs:
  format-code:
    permissions:
      contents: write
      security-events: write  # needed for SARIF upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Run Format Code Action
        uses: ministryofjustice/modernisation-platform-github-actions/format-code@2caea529829b1a7959afd2c16da632b0ea7308dc # v6.2.6
        with:
          ignore_files: "README.md"

      - name: Run Signed Commit Action
        uses: ministryofjustice/modernisation-platform-github-actions/signed-commit@6a78b87ea8e63646ec10701857c70cb2487738ab # v6.2.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_title: "GitHub Actions Code Formatter workflow"
          pr_body: "This pull request includes updates from the GitHub Actions Code Formatter workflow. Please review the changes and merge if everything looks good."
