---
name: Build Custom MegaLinter

# Builds and publishes the custom MegaLinter flavor containing only the essential linters
# for the Modernisation Platform, reducing disk space and improving CI performance.

"on":
  workflow_dispatch:
    inputs:
      megalinter_version:
        description: "MegaLinter version to build (e.g., v10.2.0)"
        required: true
        type: string
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  build-flavor:
    name: Build Custom MegaLinter Flavor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set version
        id: version
        shell: bash
        run: |
          if [ -z "${{ inputs.megalinter_version }}" ]; then
            # Default to latest MegaLinter version
            VERSION=$(curl -s https://api.github.com/repos/oxsecurity/megalinter/releases/latest | jq -r '.tag_name')
          else
            VERSION="${{ inputs.megalinter_version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building custom MegaLinter flavor: $VERSION"

      - name: Check out the custom flavor builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oxsecurity/megalinter
          ref: ${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@39760bca2cd6ffe4c8d1c63a6b51994ecb5d10f5 # v3.6.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c56667666bea2f1aef89d20f541c8c5549 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f72a4bfabd # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/modernisation-platform-github-actions
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=ref,event=branch

      - name: Build and push custom flavor
        uses: docker/build-push-action@4f58ea79222b3b9dc2c5dddf19d13cee248b3121 # v6.9.0
        with:
          context: flavors/custom-builder
          file: flavors/custom-builder/Dockerfile
          build-args: |
            MEGALINTER_VERSION=${{ steps.version.outputs.version }}
            CUSTOM_LINTERS=ACTION_ACTIONLINT,ACTION_ZIZMOR,BASH_SHELLCHECK,JSON_PRETTIER,MARKDOWN_MARKDOWNLINT,REPOSITORY_CHECKOV,REPOSITORY_GRYPE,TERRAFORM_TFLINT,TERRAFORM_TERRAFORM_FMT,YAML_YAMLLINT
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  verify-image:
    name: Verify Custom MegaLinter Image
    needs: build-flavor
    runs-on: ubuntu-latest
    steps:
      - name: Pull and inspect image
        shell: bash
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/modernisation-platform-github-actions:${{ needs.build-flavor.outputs.version }}
          docker inspect ghcr.io/${{ github.repository_owner }}/modernisation-platform-github-actions:${{ needs.build-flavor.outputs.version }}
          echo "✅ Custom MegaLinter flavor image successfully built and published"
