---
name: Build Custom MegaLinter

# Builds and publishes the custom MegaLinter flavor containing the Modernisation Platform baseline linters
# for linting, SAST, secrets scanning, and SCA. This reduces disk space requirements while maintaining
# comprehensive security and code quality checks.

"on":
  workflow_dispatch:
    inputs:
      megalinter_version:
        description: "MegaLinter version to build (e.g., v10.2.0)"
        required: true
        type: string
  schedule:
    - cron: "0 2 * * 0"

permissions: {}

jobs:
  build-flavor:
    name: Build Custom MegaLinter Flavor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CUSTOM_FLAVOR_BUILD_REPO: "modernisation-platform-github-actions-megalinter"
    steps:
      - name: Set version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.megalinter_version }}
        run: |
          if [ -z "$INPUT_VERSION" ]; then
            # Default to latest MegaLinter version
            VERSION=$(curl -s https://api.github.com/repos/oxsecurity/megalinter/releases/latest | jq -r '.tag_name')
          else
            VERSION="$INPUT_VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building custom MegaLinter flavor: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create Dockerfile for custom MegaLinter flavor
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p /tmp/megalinter-build
          cat > /tmp/megalinter-build/Dockerfile << 'EOF'
          ARG MEGALINTER_VERSION=v10.2.0
          FROM ghcr.io/oxsecurity/megalinter:${MEGALINTER_VERSION}

          # Enable only the essential linters for Modernisation Platform
          # This creates a slim image (~600-700MB vs ~4.4GB for full)
          ENV ENABLE_ACTION_ACTIONLINT=true
          ENV ENABLE_ACTION_ZIZMOR=true
          ENV ENABLE_BASH_SHELLCHECK=true
          ENV ENABLE_DOCKERFILE_HADOLINT=true
          ENV ENABLE_EDITORCONFIG_EDITORCONFIG_CHECKER=true
          ENV ENABLE_JSON_PRETTIER=true
          ENV ENABLE_MARKDOWN_MARKDOWNLINT=true
          ENV ENABLE_REPOSITORY_BETTERLEAKS=true
          ENV ENABLE_REPOSITORY_CHECKOV=true
          ENV ENABLE_REPOSITORY_GRYPE=true
          ENV ENABLE_REPOSITORY_SEMGREP=true
          ENV ENABLE_TERRAFORM_TERRAFORM_FMT=true
          ENV ENABLE_TERRAFORM_TFLINT=true
          ENV ENABLE_YAML_PRETTIER=true
          ENV ENABLE_YAML_YAMLLINT=true
          EOF

      - name: Build and push custom MegaLinter flavor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: /tmp/megalinter-build
          file: /tmp/megalinter-build/Dockerfile
          build-args: |
            MEGALINTER_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.CUSTOM_FLAVOR_BUILD_REPO }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.CUSTOM_FLAVOR_BUILD_REPO }}:latest
          labels: |
            org.opencontainers.image.title=modernisation-platform-github-actions-megalinter
            org.opencontainers.image.description=Custom MegaLinter flavor for Modernisation Platform with essential linters
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  verify-image:
    name: Verify Custom MegaLinter Image
    needs: build-flavor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and inspect image
        shell: bash
        env:
          VERSION: ${{ needs.build-flavor.outputs.version }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          docker pull "ghcr.io/$REPO_OWNER/ministryofjustice/modernisation-platform-github-actions-megalinter:$VERSION"
          docker inspect "ghcr.io/$REPO_OWNER/ministryofjustice/modernisation-platform-github-actions-megalinter:$VERSION"
          echo "✅ Custom MegaLinter flavor image successfully built and published"
