---
name: Build Custom MegaLinter

# Builds and publishes the custom MegaLinter flavor containing the Modernisation Platform baseline linters
# for linting, SAST, secrets scanning, and SCA. This reduces disk space requirements while maintaining
# comprehensive security and code quality checks.

"on":
  workflow_dispatch:
    inputs:
      megalinter_version:
        description: "MegaLinter version to build (e.g., v10.2.0)"
        required: true
        type: string
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read
  packages: write

jobs:
  build-flavor:
    name: Build Custom MegaLinter Flavor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set version
        id: version
        shell: bash
        run: |
          if [ -z "${{ inputs.megalinter_version }}" ]; then
            # Default to latest MegaLinter version
            VERSION=$(curl -s https://api.github.com/repos/oxsecurity/megalinter/releases/latest | jq -r '.tag_name')
          else
            VERSION="${{ inputs.megalinter_version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building custom MegaLinter flavor: $VERSION"

      - name: Check out the custom flavor builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: oxsecurity/megalinter
          ref: ${{ steps.version.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/modernisation-platform-github-actions-megalinter
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=ref,event=branch

      - name: Build and push custom flavor
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: flavors/custom-builder
          file: flavors/custom-builder/Dockerfile
          build-args: |
            MEGALINTER_VERSION=${{ steps.version.outputs.version }}
            CUSTOM_LINTERS=ACTION_ACTIONLINT,ACTION_ZIZMOR,BASH_SHELLCHECK,DOCKERFILE_HADOLINT,EDITORCONFIG_EDITORCONFIG_CHECKER,JSON_PRETTIER,MARKDOWN_MARKDOWNLINT,REPOSITORY_BETTERLEAKS,REPOSITORY_CHECKOV,REPOSITORY_GRYPE,REPOSITORY_SEMGREP,TERRAFORM_TERRAFORM_FMT,TERRAFORM_TFLINT,YAML_PRETTIER,YAML_YAMLLINT
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

  verify-image:
    name: Verify Custom MegaLinter Image
    needs: build-flavor
    runs-on: ubuntu-latest
    steps:
      - name: Pull and inspect image
        shell: bash
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/modernisation-platform-github-actions-megalinter:${{ needs.build-flavor.outputs.version }}
          docker inspect ghcr.io/${{ github.repository_owner }}/modernisation-platform-github-actions-megalinter:${{ needs.build-flavor.outputs.version }}
          echo "✅ Custom MegaLinter flavor image successfully built and published"
